# Copy of docker-compose.yml for IBKR (Interactive Brokers) integration.
# Exposes IBKR-related env vars and the app socket URL for the app container.

name: tradinggoose

services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.1-alpine
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    restart: always
    expose:
      - '3002'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      REDIS_URL: redis://redis:6379
      IBKR_API_BASE_URL: ${IBKR_API_BASE_URL:?IBKR_API_BASE_URL is required}
      INTERNAL_APP_URL: http://app:3000
      IBKR_TOKEN_ENDPOINT: ${IBKR_TOKEN_ENDPOINT:?IBKR_TOKEN_ENDPOINT is required}
      IBKR_API_IP: ${IBKR_API_IP:?IBKR_API_IP is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1:3002/health']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3002}
    restart: always
    # No host port mapping: the app-relay socat (WSL VM, no Tailscale iface there)
    # binds 0.0.0.0:3000 inside the WSL VM and forwards to this container's bridge IP.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      IBKR_API_BASE_URL: ${IBKR_API_BASE_URL:?IBKR_API_BASE_URL is required}
      IBKR_API_IP: ${IBKR_API_IP:?IBKR_API_IP is required}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      # Trust the local CAs that sign this host's TLS leaves:
      #  - Obsidian MCP server (https://100.64.0.8:8443)      -> HX90 Local CA
      #  - the app's own leaf on https://100.64.0.8:3000      -> TradingGoose Local CA
      #    (needed because function blocks and tool dispatch call this app's own
      #     API over https via NEXT_PUBLIC_APP_URL)
      #
      # Bun does NOT accept a comma-separated list: it treats the whole string as
      # one path, fails to load it, logs "ignoring extra certs", and then trusts
      # nothing - so the CAs must be concatenated into a single bundle file.
      # Regenerate after changing either source CA:
      #   cat certs/obsidian-ca.crt certs/tradinggoose-ca.crt > certs/local-cas.crt
      NODE_EXTRA_CA_CERTS: /opt/certs/local-cas.crt

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://realtime:3002}
      INTERNAL_REALTIME_URL: http://realtime:3002
      KRONOS_ENABLED: ${KRONOS_ENABLED:-true}
      KRONOS_INTERNAL_URL: http://kronos-inference:8000
      KRONOS_INTERNAL_TOKEN: ${KRONOS_API_TOKEN:?Set KRONOS_API_TOKEN in .env}
    volumes:
      - ./certs:/opt/certs:ro
      # Backtest artifacts (bar cache + per-window results jsonl). These must NOT
      # live in the container's /tmp: that is wiped by a restart, a recreate
      # (`up -d`) and an image rebuild, and a --samples 8 run is ~35-50h, so losing
      # it costs the whole measurement. A bind mount also makes the results
      # readable from the host without a copy-out dance.
      # The container runs as uid 1001, so the host dir must be writable by it:
      #   mkdir -p /opt/tradinggoose/backtest && chmod 0777 /opt/tradinggoose/backtest
      # Run the backtest against it:
      #   bun run apps/tradinggoose/scripts/kronos-backtest.ts --symbol "MES=F" \
      #     --step 1 --samples 8 --bars /backtest/mes-bars.json \
      #     --out /backtest/mes-ens.jsonl
      - ./backtest:/backtest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  kronos-inference:
    build:
      context: ./services/kronos-inference
      dockerfile: Dockerfile
    restart: always
    expose:
      - '8000'
    environment:
      KRONOS_API_TOKEN: ${KRONOS_API_TOKEN:?Set KRONOS_API_TOKEN in .env}
      KRONOS_MODEL_PATH: /models/kronos-base
      KRONOS_TOKENIZER_PATH: /models/kronos-tokenizer-base
    volumes:
      - ./services/kronos-inference/models:/models:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
